stages:
  - build_frontend
  - docker_build
  - deploy

# ------- Global cache untuk node_modules
default:
  cache:
    key: "npm-${CI_COMMIT_REF_SLUG}"
    paths:
      - .cache/npm/
      - node_modules/
    policy: pull-push

# ------- 1) Build Vue (tanpa Docker) -> hasil ke artifacts
build:vue:
  stage: build_frontend
  image: node:20
  before_script:
    - node -v && npm -v
    - npm ci --cache ./.cache/npm --prefer-offline
  script:
    - npm run build
  artifacts:
    when: on_success
    paths:
      - dist/
    expire_in: 7 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# ------- 2) Build & Push Docker image untuk TEST (develop)
docker:build:test:
  stage: docker_build
  image: docker:26.1.3
  services:
    - name: docker:26.1.3-dind
      alias: dind
  variables:
    DOCKER_HOST: tcp://dind:2375
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: ""   # non-TLS untuk kesederhanaan di runner privat
  needs: [ "build:vue" ]
  script:
    - test -n "$TIC_DOCKER_HOST" || (echo "TIC_DOCKER_HOST env kosong" && exit 1)
    - test -n "$TIC_DOCKER_USERNAME" || (echo "TIC_DOCKER_USERNAME env kosong" && exit 1)
    - test -n "$TIC_DOCKER_PWD" || (echo "TIC_DOCKER_PWD env kosong" && exit 1)
    - test -n "$PROJECT_NAME" || (echo "PROJECT_NAME env kosong" && exit 1)

    # (Opsional) kalau Dockerfile butuh folder dist/, copy sebelum build
    # Pastikan Dockerfile-mu mendukung copy dist/
    - docker login -u "$TIC_DOCKER_USERNAME" -p "$TIC_DOCKER_PWD" "$TIC_DOCKER_HOST"
    - export IMAGE_TAG="beta-${CI_COMMIT_SHA}"
    - docker build -t "$TIC_DOCKER_HOST/$TIC_DOCKER_USERNAME/$PROJECT_NAME:$IMAGE_TAG" .
    - docker push "$TIC_DOCKER_HOST/$TIC_DOCKER_USERNAME/$PROJECT_NAME:$IMAGE_TAG"
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

# ------- 3) Deploy ke CapRover TEST (develop)
deploy:test:
  stage: deploy
  image: alpine:3.20
  needs: [ "docker:build:test" ]
  script:
    - apk add --no-cache nodejs npm
    - export IMAGE_TAG="beta-${CI_COMMIT_SHA}"
    - npx caprover@2.3.0 deploy \
        --caproverUrl "$TIC_CAPROVER_URL" \
        --caproverPassword "$TIC_CAPROVER_PWD" \
        --caproverApp "$PROJECT_NAME_DEMO" \
        --imageName "$TIC_DOCKER_HOST/$TIC_DOCKER_USERNAME/$PROJECT_NAME:$IMAGE_TAG"
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

# ------- 4) Build & Push Docker image untuk PROD (main)
docker:build:prod:
  stage: docker_build
  image: docker:26.1.3
  services:
    - name: docker:26.1.3-dind
      alias: dind
  variables:
    DOCKER_HOST: tcp://dind:2375
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: ""
  needs: [ "build:vue" ]
  script:
    - test -n "$TIC_DOCKER_HOST" || (echo "TIC_DOCKER_HOST env kosong" && exit 1)
    - test -n "$TIC_DOCKER_USERNAME" || (echo "TIC_DOCKER_USERNAME env kosong" && exit 1)
    - test -n "$TIC_DOCKER_PWD" || (echo "TIC_DOCKER_PWD env kosong" && exit 1)
    - test -n "$PROJECT_NAME" || (echo "PROJECT_NAME env kosong" && exit 1)
    - docker login -u "$TIC_DOCKER_USERNAME" -p "$TIC_DOCKER_PWD" "$TIC_DOCKER_HOST"
    - export IMAGE_TAG="stable-${CI_COMMIT_SHA}"
    - docker build -t "$TIC_DOCKER_HOST/$TIC_DOCKER_USERNAME/$PROJECT_NAME:$IMAGE_TAG" .
    - docker push "$TIC_DOCKER_HOST/$TIC_DOCKER_USERNAME/$PROJECT_NAME:$IMAGE_TAG"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# ------- 5) Deploy ke CapRover PROD (main)
deploy:prod:
  stage: deploy
  image: alpine:3.20
  needs: [ "docker:build:prod" ]
  script:
    - apk add --no-cache nodejs npm
    - export IMAGE_TAG="stable-${CI_COMMIT_SHA}"
    - npx caprover@2.3.0 deploy \
        --caproverUrl "$CAPROVER_URL" \
        --caproverPassword "$CAPROVER_PWD" \
        --caproverApp "$PROJECT_NAME" \
        --imageName "$TIC_DOCKER_HOST/$TIC_DOCKER_USERNAME/$PROJECT_NAME:$IMAGE_TAG"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
