# /deploy/nginx.conf
user  nginx;
worker_processes  auto;

events {
  worker_connections  1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  tcp_nopush    on;
  keepalive_timeout  65;

  # ---- Rate limit ringan untuk path sensitif (5 req/detik per IP)
  limit_req_zone $binary_remote_addr zone=ratelimit:10m rate=5r/s;

  # ---- Security headers dasar
  map $sent_http_content_type $csp {
    default "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob:;";
  }

  server {
    listen 80 default_server;
    server_name _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Real client IP lewat CapRover reverse proxy
    real_ip_header X-Forwarded-For;
    set_real_ip_from  0.0.0.0/0;

    # ---- Static caching
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|webp|ico|woff2?|ttf|eot)$ {
      try_files $uri =404;
      expires 30d;
      add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Favicon: hilangkan 404 noise
    location = /favicon.ico {
      try_files /favicon.ico =204;
      expires 7d;
      log_not_found off;
      access_log off;
    }

    # robots.txt (opsional)
    location = /robots.txt {
      try_files /robots.txt =404;
      access_log off;
    }

    # ---- Block scanner & jalur umum yang tidak ada
    location ~* ^/(graphql|swagger|swagger-ui\.html|api-docs|v2|v3|actuator|server-status|telescope|webjars|login\.action|_all_dbs|@vite|ecp|debug|info\.php) {
      limit_req zone=ratelimit burst=10 nodelay;
      return 404;
      access_log off;
    }

    # ---- Deny dotfiles & file sensitif
    location ~* /\.(env|git|vscode|DS_Store) {
      deny all;
      access_log off;
    }

    # ---- Jangan rewrite prefix /api ke index.html (biar 404 cepat)
    location ^~ /api {
      return 404;
      access_log off;
    }

    # ---- SPA fallback (Vue Router history mode)
    location / {
      try_files $uri $uri/ /index.html;
    }

    # ---- Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy $csp always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  }
}
